<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Scout Lane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=lilac22">
  <script src="/theme-boot.js?v=mira1"></script>
</head>
<body>
  <div class="looks auth-looks" data-looks></div>
  <div class="auth" id="auth-field">
    <form class="card" id="login" method="post" action="/api/login">
      <div class="brand" style="padding:0 0 4px">
        <div class="mark" aria-hidden="true">S</div>
        <div>
          <h1>Scout Lane</h1>
          <small class="muted">เข้าสู่ระบบด้วยบัญชีขององค์กร</small>
        </div>
      </div>
      <label for="username">ชื่อผู้ใช้</label>
      <input id="username" name="username" autocomplete="username" required minlength="2" maxlength="32">
      <label for="password">รหัสผ่าน</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required maxlength="200">
      <div class="row">
        <button class="btn" type="submit" id="login-go">
          <span class="btn-label">เข้าสู่ระบบ</span>
          <span class="btn-wait" aria-hidden="true">
            <span class="spin"></span>
            กำลังเข้าสู่ระบบ
          </span>
        </button>
      </div>
      <div class="err" id="msg"></div>
    </form>
  </div>
  <script src="/theme.js?v=lilac1"></script>
  <script src="/login.js?v=mira10"></script>
</body>
</html>
